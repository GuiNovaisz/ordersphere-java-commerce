name: Backend CI
on:
  push:
    branches: [main, feature/backend-foundation]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit, PostgreSQL integration, security and concurrency tests
        run: ./mvnw -B -ntp clean verify
      - name: Docker image
        run: docker build -t ordersphere:ci .
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
