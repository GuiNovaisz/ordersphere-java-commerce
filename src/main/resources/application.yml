spring:
  application:
    name: ordersphere
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/ordersphere}
    username: ${DB_USERNAME:ordersphere}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
      connection-init-sql: SET lock_timeout = '5s'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
logging:
  level:
    org.hibernate.orm.jdbc.error: OFF
  structured:
    format:
      console: logstash
