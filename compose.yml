services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ordersphere
      POSTGRES_USER: ordersphere
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ordersphere -d ordersphere"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://db:5432/ordersphere
      DB_USERNAME: ordersphere
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      ORDERSPHERE_ADMIN_EMAIL: ${ORDERSPHERE_ADMIN_EMAIL:?Set bootstrap admin email}
      ORDERSPHERE_ADMIN_PASSWORD: ${ORDERSPHERE_ADMIN_PASSWORD:?Set bootstrap admin password}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    mem_limit: 768m
    restart: unless-stopped
volumes:
  postgres_data:
networks:
  backend:
